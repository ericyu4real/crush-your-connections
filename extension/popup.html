<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Crush Your Connections</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body data-tone="idle">
  <main>
    <header>
      <img class="logo" src="logo.svg" alt="" width="40" height="40">
      <div class="brand">
        <h1>Crush Your Connections</h1>
        <p class="tag">Zip and Queens</p>
      </div>
      <span id="badge">Scanning</span>
    </header>

    <section class="hero">
      <p id="status" aria-live="polite">Looking for a board…</p>
      <p id="meta" hidden></p>
    </section>

    <svg class="trail" viewBox="0 0 280 64" aria-hidden="true">
      <defs>
        <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ffb088" />
          <stop offset="1" stop-color="#ff6a2a" />
        </linearGradient>
      </defs>
      <path
        class="snake"
        pathLength="100"
        d="M18 48 L18 16 L70 16 L70 48 L132 48 L132 16 L198 16 L198 48 L262 48 L262 16"
      />
      <circle class="node" cx="18" cy="16" r="3" />
      <circle class="node" cx="70" cy="16" r="3" />
      <circle class="node" cx="70" cy="48" r="3" />
      <circle class="node" cx="132" cy="48" r="3" />
      <circle class="node" cx="132" cy="16" r="3" />
      <circle class="node" cx="198" cy="16" r="3" />
      <circle class="node" cx="198" cy="48" r="3" />
      <circle class="dot start" cx="18" cy="48" r="5" />
      <circle class="dot end" cx="262" cy="16" r="5" />
    </svg>

    <button id="solve" type="button" disabled>Crush</button>
    <footer>
      <p id="hint">Open LinkedIn Zip or Queens, start the game, then click Crush.</p>
      <button id="copy-debug" type="button">Debug</button>
    </footer>
    <pre id="debug" hidden></pre>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
